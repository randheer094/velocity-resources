name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build archives
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="velocity-resources-${tag}"
          mkdir -p dist
          tar -czf "dist/${base}.tar.gz" go android prompts
          zip -qr "dist/${base}.zip" go android prompts
          (cd dist && sha256sum "${base}.tar.gz" "${base}.zip" > SHA256SUMS)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/velocity-resources-${GITHUB_REF_NAME}.tar.gz \
            dist/velocity-resources-${GITHUB_REF_NAME}.zip \
            dist/SHA256SUMS
